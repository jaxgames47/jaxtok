<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaxTok - Short Video Feed</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f0f13',
                        cardBg: '#18181c',
                        accentPink: '#fe2c55',
                        accentCyan: '#25f4ee',
                    },
                    animation: {
                        'rainbow-glow': 'rainbowGlow 6s ease infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        rainbowGlow: {
                            '0%, 100%': { filter: 'hue-rotate(0deg)' },
                            '50%': { filter: 'hue-rotate(360deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f13;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        /* Custom scrollbar for vertical feed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .rainbow-btn {
            background: linear-gradient(135deg, #fe2c55, #25f4ee, #ff007f, #7928ca);
            background-size: 300% 300%;
            animation: rainbowShift 5s ease infinite;
        }
        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-darkBg min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <h1 class="text-2xl font-black tracking-tighter bg-gradient-to-r from-accentPink to-accentCyan bg-clip-text text-transparent">JaxTok</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700">beta</span>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Rainbow JaxTok Button -->
            <button onclick="openUploadModal()" class="rainbow-btn text-white text-sm font-bold px-4 py-2 rounded-full shadow-lg transform transition active:scale-95 flex items-center space-x-2 animate-rainbow-glow">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>JaxTok Upload</span>
            </button>
            <button onclick="openProfile()" class="w-9 h-9 rounded-full bg-gray-700 overflow-hidden border border-gray-600 flex items-center justify-center hover:ring-2 hover:ring-accentCyan transition">
                <img src="https://placehold.co/100x100/25f4ee/0f0f13?text=ME" alt="Profile" class="w-full h-full object-cover">
            </button>
        </div>
    </header>

    <!-- Main Content Area: Vertical Video Feed -->
    <main class="flex-1 flex justify-center items-center relative overflow-hidden">
        <div id="videoFeedContainer" class="w-full max-w-md h-[calc(100vh-65px)] overflow-y-scroll snap-y snap-mandatory no-scrollbar relative">
            <!-- Video cards will be injected dynamically here -->
        </div>

        <!-- Floating Sidebar Tools (Desktop / Quick Actions) -->
        <div class="hidden lg:flex flex-col space-y-4 absolute right-12 bottom-20 z-20">
            <button onclick="scrollToNextVideo()" class="w-12 h-12 bg-gray-800/80 hover:bg-gray-700 text-white rounded-full flex items-center justify-center backdrop-blur-md shadow-lg transition">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>
    </main>

    <!-- Upload / Record Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardBg w-full max-w-lg rounded-2xl border border-gray-800 p-6 shadow-2xl relative animate-fadeIn">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-xl font-bold mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-video text-accentCyan"></i>
                <span>Upload a JaxTok Video</span>
            </h2>
            
            <form id="uploadForm" onsubmit="handleVideoUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Video File (MP4/WebM)</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gray-800 file:text-accentCyan hover:file:bg-gray-700 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Caption / Description</label>
                    <textarea id="videoCaption" rows="3" placeholder="What's on your mind? #jaxtok #viral" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:border-accentCyan text-white resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Your Creator Handle</label>
                    <input type="text" id="creatorName" value="@jaxcreator" required class="w-full bg-darkBg border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-accentCyan text-white">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl rainbow-btn text-white font-bold text-sm shadow-lg transform transition active:scale-95">
                    Publish to JaxTok Feed 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="commentsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center">
        <div class="bg-cardBg w-full max-w-md h-[70vh] sm:h-[500px] rounded-t-3xl sm:rounded-2xl border border-gray-800 flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 id="commentsTitle" class="font-bold text-sm">Comments (0)</h3>
                <button onclick="closeCommentsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Comments injected dynamically -->
            </div>
            <div class="p-3 border-t border-gray-800 flex space-x-2">
                <input type="text" id="commentInput" placeholder="Add a comment..." class="flex-1 bg-darkBg border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accentCyan">
                <button onclick="postComment()" class="bg-accentCyan text-darkBg font-bold px-4 py-2 rounded-xl text-sm hover:opacity-95 transition">Post</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 border border-gray-700 text-white px-4 py-2 rounded-xl shadow-2xl text-xs flex items-center space-x-2 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <i class="fa-solid fa-circle-check text-accentCyan"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Mock Videos Data (Empty feed on start)
        let videos = [];

        let currentActiveVideoId = null;
        let activeCommentsVideoId = null;

        // Number Formatting Helper Function
        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num;
        }

        // Render Feed
        function renderFeed() {
            const container = document.getElementById('videoFeedContainer');
            container.innerHTML = '';

            if (videos.length === 0) {
                container.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center text-center p-8 text-gray-400 space-y-5 border border-dashed border-gray-800 rounded-2xl bg-cardBg/30 my-2">
                        <div class="w-20 h-20 rounded-full bg-gray-800/80 flex items-center justify-center text-3xl text-accentCyan border border-gray-700 shadow-xl">
                            <i class="fa-solid fa-video-slash"></i>
                        </div>
                        <div class="space-y-2 max-w-xs">
                            <h2 class="text-xl font-bold text-white tracking-wide">Nothing Here!</h2>
                            <p class="text-sm text-gray-400">Upload something to go viral!</p>
                        </div>
                        <button onclick="openUploadModal()" class="rainbow-btn text-white text-sm font-bold px-6 py-3 rounded-full shadow-lg transform transition active:scale-95 flex items-center space-x-2 animate-rainbow-glow">
                            <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                            <span>Upload First Video</span>
                        </button>
                    </div>
                `;
                return;
            }

            videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'w-full h-full snap-start relative flex items-center justify-center bg-black overflow-hidden group';
                card.innerHTML = `
                    <video id="vid-${vid.id}" src="${vid.url}" class="w-full h-full object-cover cursor-pointer" loop playsinline muted onclick="togglePlayPause(${vid.id})"></video>
                    
                    <!-- Gradient Overlays for Readability -->
                    <div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/60 to-transparent pointer-events-none"></div>
                    <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/80 via-black/40 to-transparent pointer-events-none"></div>

                    <!-- Play/Pause Indicator Overlay -->
                    <div id="play-icon-${vid.id}" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity">
                        <div class="w-16 h-16 bg-black/50 rounded-full flex items-center justify-center text-white text-2xl backdrop-blur-sm">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>

                    <!-- Right Side Interactive Buttons -->
                    <div class="absolute right-4 bottom-24 flex flex-col items-center space-y-5 z-10">
                        <div class="flex flex-col items-center">
                            <button onclick="likeVideo(${vid.id})" class="w-12 h-12 rounded-full bg-gray-900/60 backdrop-blur-md flex items-center justify-center text-xl transition transform active:scale-125 ${vid.liked ? 'text-accentPink' : 'text-white hover:text-accentPink'}">
                                <i class="fa-${vid.liked ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                            <span class="text-xs font-bold mt-1 text-white drop-shadow">${formatNumber(vid.likes)}</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <button onclick="openComments(${vid.id})" class="w-12 h-12 rounded-full bg-gray-900/60 backdrop-blur-md flex items-center justify-center text-xl text-white hover:text-accentCyan transition">
                                <i class="fa-solid fa-comment-dots"></i>
                            </button>
                            <span class="text-xs font-bold mt-1 text-white drop-shadow">${vid.comments.length}</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <button onclick="shareVideo()" class="w-12 h-12 rounded-full bg-gray-900/60 backdrop-blur-md flex items-center justify-center text-lg text-white hover:text-accentCyan transition">
                                <i class="fa-solid fa-share"></i>
                            </button>
                            <span class="text-xs font-bold mt-1 text-white drop-shadow">Share</span>
                        </div>
                    </div>

                    <!-- Bottom Creator Details & Caption -->
                    <div class="absolute left-4 bottom-6 right-20 z-10 space-y-2 pointer-events-auto">
                        <div class="flex items-center space-x-3">
                            <img src="${vid.avatar}" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-accentCyan object-cover">
                            <span class="font-bold text-sm text-white drop-shadow">${vid.creator}</span>
                            <button class="bg-accentPink text-white text-xs font-bold px-3 py-1 rounded-full shadow hover:opacity-95 transition">Follow</button>
                        </div>
                        <p class="text-sm text-gray-200 line-clamp-2 drop-shadow">${vid.caption}</p>
                    </div>
                `;
                container.appendChild(card);
            });

            initIntersectionObserver();
        }

        // Intersection Observer to auto-play active video in view
        function initIntersectionObserver() {
            const options = {
                root: document.getElementById('videoFeedContainer'),
                threshold: 0.6
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const videoId = entry.target.querySelector('video').id.split('-')[1];
                    const videoElement = document.getElementById(`vid-${videoId}`);
                    
                    if (entry.isIntersecting) {
                        videoElement.play().catch(e => console.log("Autoplay blocked:", e));
                        currentActiveVideoId = videoId;
                    } else {
                        videoElement.pause();
                        videoElement.currentTime = 0;
                    }
                });
            }, options);

            document.querySelectorAll('#videoFeedContainer > div').forEach(card => {
                observer.observe(card);
            });
        }

        // Toggle Play / Pause on click
        function togglePlayPause(id) {
            const video = document.getElementById(`vid-${id}`);
            const playIcon = document.getElementById(`play-icon-${id}`);
            if (video.paused) {
                video.play();
                playIcon.style.opacity = '0';
            } else {
                video.pause();
                playIcon.style.opacity = '1';
                setTimeout(() => { playIcon.style.opacity = '0'; }, 500);
            }
        }

        // Like Video Toggle
        function likeVideo(id) {
            const vid = videos.find(v => v.id === id);
            if (vid) {
                vid.liked = !vid.liked;
                vid.likes += vid.liked ? 1 : -1;
                renderFeed();
            }
        }

        // Open Comments Modal
        function openComments(id) {
            activeCommentsVideoId = id;
            const vid = videos.find(v => v.id === id);
            if (!vid) return;

            document.getElementById('commentsTitle').innerText = `Comments (${vid.comments.length})`;
            const list = document.getElementById('commentsList');
            list.innerHTML = vid.comments.map(c => `
                <div class="flex items-start space-x-3 text-sm">
                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center font-bold text-xs text-accentCyan">${c.user[1].toUpperCase()}</div>
                    <div class="flex-1 bg-darkBg p-3 rounded-xl border border-gray-800">
                        <span class="font-bold text-xs text-accentCyan block mb-0.5">${c.user}</span>
                        <p class="text-gray-300 text-xs">${c.text}</p>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-gray-500 text-center py-6">No comments yet. Be the first!</p>';

            document.getElementById('commentsModal').classList.remove('hidden');
        }

        function closeCommentsModal() {
            document.getElementById('commentsModal').classList.add('hidden');
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !activeCommentsVideoId) return;

            const vid = videos.find(v => v.id === activeCommentsVideoId);
            if (vid) {
                vid.comments.push({ user: '@jaxcreator', text: text });
                input.value = '';
                openComments(activeCommentsVideoId);
                renderFeed();
            }
        }

        // Scroll to next video function
        function scrollToNextVideo() {
            const container = document.getElementById('videoFeedContainer');
            container.scrollBy({ top: container.clientHeight, behavior: 'smooth' });
        }

        // Upload Modal Controls
        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        function handleVideoUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('videoFile');
            const caption = document.getElementById('videoCaption').value;
            const creator = document.getElementById('creatorName').value;

            if (fileInput.files && fileInput.files[0]) {
                const fileURL = URL.createObjectURL(fileInput.files[0]);
                
                const newVideo = {
                    id: Date.now(),
                    url: fileURL,
                    caption: caption,
                    creator: creator,
                    avatar: 'https://placehold.co/100x100/25f4ee/0f0f13?text=JC',
                    likes: 1,
                    comments: [],
                    liked: false
                };

                videos.unshift(newVideo);
                renderFeed();
                closeUploadModal();
                showToast("Video uploaded successfully to JaxTok!");
                document.getElementById('uploadForm').reset();
            }
        }

        function shareVideo() {
            showToast("Video link copied to clipboard!");
        }

        function openProfile() {
            showToast("Logged in as @jaxcreator");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Initial setup on load
        window.onload = () => {
            renderFeed();
        };
    </script>
</body>
</html>
