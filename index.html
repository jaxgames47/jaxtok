<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JaxTok</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--a:#ec4899}
html,body,#root{height:100vh;height:100dvh!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}
@keyframes pop{0%{transform:scale(0);opacity:1}50%{transform:scale(1.4)}100%{transform:scale(1) translateY(-50px);opacity:0}}
@keyframes bnc{0%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vw{position:relative;width:100%;height:100%}
.clip{position:absolute;inset:0;overflow:hidden;background:#000}
#side,.arrows{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{animation:spin 5s linear infinite}
@media (min-width:700px){
#root{flex-direction:row!important}
#bot{display:none!important}
#side{display:flex;flex-direction:column;width:72px}
.vw{max-width:calc((100vh - 24px)*9/16);max-width:calc((100dvh - 24px)*9/16);height:calc(100% - 24px)}
.clip{border-radius:16px}
.acts{right:-68px!important}
.arrows{display:flex}
.tabs{display:none!important}
#view>div.fi:not(#feed){max-width:760px;margin:0 auto;width:100%}
}
@media (min-width:1000px){#side{width:240px}}
@media (max-width:999px){#side .lbl{display:none}}
body.cr #bot{display:none!important}
.hp{animation:pop .8s ease-out forwards}.bnc{animation:bnc .35s}.sheet{animation:up .3s cubic-bezier(.2,.9,.3,1)}.fi{animation:fade .25s ease-out}
button:active{transform:scale(.95)}button{transition:transform .1s}
</style>
</head>
<body class="h-full text-white overflow-hidden">
<div id="toasts" class="fixed top-4 inset-x-0 z-[60] flex flex-col items-center gap-2 pointer-events-none"></div>
<div id="root" class="h-full flex flex-col"></div>
<script>
const API = 'https://jaxtok.onrender.com';
let token = localStorage.getItem('jt'), ME = null, S = { tab: 'home', feed: 'foryou', q: '', chat: null }, V = {}, CUR = [], signup = false, _cb = null, _sv = null, UG = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = (b, m = 'POST') => ({ method: m, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
async function api(p, o = {}) {
  o.headers = { ...(o.headers || {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  const r = await fetch(API + p, o), d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
function toast(m, err) {
  const t = document.createElement('div');
  t.className = 'fi px-4 py-2 rounded-full text-xs font-semibold shadow-xl ' + (err ? 'bg-red-600' : 'bg-zinc-800');
  t.textContent = m; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3000);
}
const fail = (e) => toast(e.message, 1);
const theme = () => document.documentElement.style.setProperty('--a', ME.settings.accent || '#ec4899');
const inp = 'w-full min-w-0 px-4 py-3 rounded-xl bg-white/10 text-sm outline-none focus:ring-1 focus:ring-[var(--a)]';
let MUTE = localStorage.getItem('jt_mute') == '1', BLOCKED = false;
const soundOn = () => !MUTE;

// if the browser blocked sound, the first tap anywhere turns it on
['pointerdown', 'keydown', 'touchend'].forEach((ev) => addEventListener(ev, () => {
  if (!BLOCKED || MUTE) return; BLOCKED = false;
  document.querySelectorAll('section video').forEach((v) => { v.muted = false; }); if ($('tapsnd')) $('tapsnd').remove();
}, { passive: true }));

// ---------- auth ----------
function authView() {
  $('root').innerHTML = `<div class="h-full w-full flex items-center justify-center p-6 bg-gradient-to-b from-zinc-900 to-black fi">
  <form onsubmit="auth(event)" class="w-full max-w-sm space-y-3 text-center">
    <img src="${uri(LOGO)}" class="w-20 h-20 mx-auto" alt="JaxTok">
    <h1 class="text-2xl font-extrabold">${signup ? 'Join JaxTok' : 'Welcome to JaxTok'}</h1>
    <input id="em" type="email" required placeholder="Email" class="${inp}">
    <input id="pw" type="password" required minlength="6" placeholder="Password (6+ characters)" class="${inp}">
    <button class="w-full py-3 rounded-xl font-semibold bg-[var(--a)]">${signup ? 'Create account' : 'Sign in'}</button>
    <button type="button" onclick="signup=!signup;authView()" class="text-xs text-white/60">${signup ? 'Have an account? Sign in' : 'New here? Create an account'}</button>
  </form></div>`;
}
async function auth(e) {
  e.preventDefault();
  try {
    const d = await api(signup ? '/api/signup' : '/api/login', J({ email: $('em').value.trim(), password: $('pw').value }));
    token = d.token; localStorage.setItem('jt', token); ME = d; boot();
  } catch (x) { fail(x); }
}
function logout() { token = null; ME = null; localStorage.removeItem('jt'); closeSheet(); signup = false; authView(); }

// ---------- shell ----------
const NAV = [['home', 'house', 'Home'], ['search', 'magnifying-glass', 'Discover'], ['upload', 'plus', ''], ['inbox', 'paper-plane', 'Inbox'], ['me', 'user', 'Profile']];
const SIDE = [['home', 'house', 'For You'], ['search', 'compass', 'Discover'], ['following', 'user-group', 'Following'], ['inbox', 'paper-plane', 'Inbox'], ['upload', 'square-plus', 'Upload'], ['me', 'user', 'Profile']];
// phone (<700px) = bottom bar, tablet = icon rail, PC (1000px+) = full sidebar. Layout is switched live by CSS.
const setDev = () => { document.documentElement.dataset.dev = innerWidth < 700 ? 'phone' : innerWidth < 1000 ? 'tablet' : 'pc'; };
setDev(); addEventListener('resize', setDev);
function boot() {
  theme();
  api('/api/users/jaxtok').then((u) => { ME.followsJt = u.isFollowing; }).catch(() => {});
  $('root').innerHTML = `<aside id="side" class="shrink-0 border-r border-white/10 gap-1 p-3 overflow-y-auto ns">
  <div class="flex items-center gap-2 px-2 py-3"><img src="${uri(LOGO)}" class="w-9 h-9" alt=""><b class="lbl text-xl font-extrabold">JaxTok</b></div>
  ${SIDE.map(([t, i, l]) => `<button id="s-${t}" onclick="sideGo('${t}')" class="flex items-center gap-3 px-3 py-3 rounded-xl text-left hover:bg-white/5"><i class="fa-solid fa-${i} text-xl w-7 text-center"></i><b class="lbl text-base">${l}</b></button>`).join('')}</aside>
  <div id="view" class="flex-1 relative overflow-hidden min-w-0"></div>
  <nav id="bot" class="shrink-0 h-14 bg-black border-t border-white/10 flex items-center justify-around text-[10px] pb-[env(safe-area-inset-bottom)] box-content">
  ${NAV.map(([t, i, l]) => t == 'upload'
    ? `<button id="n-upload" onclick="go('upload')" class="w-12 h-8 rounded-lg bg-gradient-to-r from-cyan-400 to-[var(--a)] flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>`
    : `<button id="n-${t}" onclick="go('${t}')" class="flex flex-col items-center gap-0.5 w-14"><i class="fa-solid fa-${i} text-lg"></i>${l}</button>`).join('')}</nav>`;
  go('home');
}
function hl(t) {
  NAV.forEach(([k]) => { const b = $('n-' + k); if (b && k != 'upload') b.style.opacity = k == t ? 1 : .5; });
  const key = t == 'home' && S.feed == 'following' ? 'following' : t;
  SIDE.forEach(([k]) => { const b = $('s-' + k); if (b) { b.style.color = k == key ? 'var(--a)' : ''; b.style.opacity = k == key ? 1 : .85; } });
}
function sideGo(t) { if (t == 'home' || t == 'following') { S.feed = t == 'home' ? 'foryou' : 'following'; t = 'home'; } go(t); }
function go(t) {
  closeSheet(); if ($('ov')) $('ov').remove(); stopCam();
  document.body.classList.toggle('cr', t == 'upload');
  S.tab = t; S.chat = null; hl(t);
  ({ home: homeView, search: searchView, upload: createView, inbox: inboxView, me: () => profileView() })[t]();
}

// ---------- sheets ----------
function sheet(h) {
  closeSheet();
  const d = document.createElement('div');
  d.id = 'sheet'; d.className = 'fixed inset-0 z-50 bg-black/60 flex items-end justify-center fi';
  d.onclick = (e) => { if (e.target == d) closeSheet(); };
  d.innerHTML = `<div class="sheet w-full max-w-md bg-zinc-900 rounded-t-3xl max-h-[88vh] overflow-y-auto ns">${h}</div>`;
  document.body.appendChild(d);
}
const closeSheet = () => { if ($('sheet')) $('sheet').remove(); };

// ---------- feed ----------
const cap = (c) => esc(c).replace(/#(\w+)/g, '<b class="cursor-pointer" onclick="searchFor(\'#$1\')">#$1</b>');
const likeIn = (v) => `<div class="w-12 h-12 rounded-full bg-black/40 flex items-center justify-center text-2xl ${v.liked ? 'text-[var(--a)]' : ''}"><i class="fa-${v.liked ? 'solid' : 'regular'} fa-heart"></i></div><span class="text-xs font-semibold">${v.likes}</span>`;
// portrait videos fill the screen like TikTok; landscape ones stay whole
const fitV = (v) => { v.style.objectFit = v.videoHeight > v.videoWidth ? 'cover' : 'contain'; };
const tapV = (v) => { if (soundOn()) v.muted = false; v.paused ? v.play() : v.pause(); };
function card(v) {
  V[v.id] = v;
  return `<section data-v="${v.id}" ondblclick="dbl('${v.id}',event)" class="h-full w-full snap-start snap-always relative bg-black flex items-center justify-center">
  <div class="vw"><div class="clip">
    <video src="${API + v.url}" crossorigin="anonymous" loop playsinline preload="metadata" class="h-full w-full object-contain" onloadedmetadata="fitV(this)" onclick="tapV(this)"></video>
    <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/80 to-transparent pointer-events-none"></div>
    <button onclick="toggleMute()" class="mb absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-sm"><i class="fa-solid ${MUTE ? 'fa-volume-xmark' : 'fa-volume-high'}"></i></button>
    <div class="absolute left-4 bottom-5 right-20 z-10"><b class="text-sm cursor-pointer" onclick="openUser('${v.author}')">@${esc(v.author)}</b><p class="text-xs mt-1 line-clamp-2">${cap(v.caption)}</p>
      <button onclick="useSound('${v.id}')" class="mt-1.5 flex items-center gap-1.5 text-xs max-w-full"><i class="fa-solid fa-music"></i><span class="truncate">original sound - @${esc(v.author)}</span></button></div>
  </div>
  <div class="acts absolute right-3 bottom-8 flex flex-col items-center gap-4 z-10">
    <div class="relative mb-2"><button onclick="openUser('${v.author}')" class="w-12 h-12 rounded-full border-2 border-white overflow-hidden">${avi(v.avatar, v.author, 'w-full h-full text-lg')}</button>
    ${v.author != ME.username ? `<button data-f="${v.author}" onclick="follow('${v.author}')" class="plus absolute -bottom-2 left-3.5 w-5 h-5 rounded-full bg-[var(--a)] text-xs flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>` : ''}</div>
    <button data-lk="${v.id}" onclick="like('${v.id}')" class="flex flex-col items-center gap-1">${likeIn(v)}</button>
    <button onclick="comments('${v.id}')" class="flex flex-col items-center gap-1"><div class="w-12 h-12 rounded-full bg-black/40 flex items-center justify-center text-xl"><i class="fa-solid fa-comment-dots"></i></div><span data-cc="${v.id}" class="text-xs font-semibold">${v.comments.length}</span></button>
    <button onclick="share('${v.id}')" class="flex flex-col items-center gap-1"><div class="w-12 h-12 rounded-full bg-black/40 flex items-center justify-center text-xl"><i class="fa-solid fa-share"></i></div><span class="text-xs font-semibold">Share</span></button>
    <button onclick="useSound('${v.id}')" class="disc w-11 h-11 rounded-full bg-zinc-900 border-[6px] border-zinc-800 flex items-center justify-center overflow-hidden">${avi(v.avatar, v.author, 'w-6 h-6 text-[10px]')}</button>
  </div></div></section>`;
}
function autoplay(root) {
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    const v = e.target;
    if (e.isIntersecting) {
      fitV(v);
      v.muted = !soundOn();
      if (ME.settings.autoplay !== false) v.play().catch(() => { v.muted = true; if (!MUTE) { BLOCKED = true; tapPill(); } v.play().catch(() => {}); });
    } else { v.pause(); v.currentTime = 0; }
  }), { threshold: .6 });
  root.querySelectorAll('video').forEach((v) => io.observe(v));
}
async function homeView() {
  $('view').innerHTML = `<div class="tabs absolute top-0 inset-x-0 z-20 flex justify-center gap-6 pt-3 text-sm font-bold drop-shadow">
  ${['following', 'foryou'].map((t) => `<button onclick="S.feed='${t}';homeView();hl('home')" class="pb-1 border-b-2 ${S.feed == t ? 'border-white' : 'border-transparent text-white/60'}">${t == 'foryou' ? 'For You' : 'Following'}</button>`).join('')}</div>
  <div id="feed" class="h-full overflow-y-scroll ns snap-y snap-mandatory fi"></div>
  <div class="arrows fixed right-5 top-1/2 -translate-y-1/2 z-30 flex-col gap-3"><button onclick="feedGo(-1)" class="w-11 h-11 rounded-full bg-white/10"><i class="fa-solid fa-chevron-up"></i></button><button onclick="feedGo(1)" class="w-11 h-11 rounded-full bg-white/10"><i class="fa-solid fa-chevron-down"></i></button></div>`;
  try {
    const l = await api('/api/videos?tab=' + S.feed), f = $('feed');
    if (!f) return;
    f.innerHTML = withAds(l) || `<div class="h-full flex flex-col items-center justify-center text-center p-8 text-white/60 text-sm"><i class="fa-solid fa-film text-4xl mb-3"></i>${S.feed == 'following' ? 'Follow some creators to fill this feed.' : 'No videos yet. Be the first to post!'}</div>`;
    autoplay(f);
  } catch (e) { fail(e); }
}
async function like(id) {
  try {
    const v = await api('/api/videos/' + id + '/like', { method: 'POST' }); V[id] = v;
    document.querySelectorAll(`[data-lk="${id}"]`).forEach((b) => { b.innerHTML = likeIn(v); b.firstChild.classList.add('bnc'); });
  } catch (e) { fail(e); }
}
function dbl(id, e) {
  const s = e.currentTarget, r = s.getBoundingClientRect(), h = document.createElement('i');
  h.className = 'fa-solid fa-heart hp absolute text-6xl text-[var(--a)] pointer-events-none z-20';
  h.style.cssText = `left:${e.clientX - r.left - 30}px;top:${e.clientY - r.top - 30}px`;
  s.appendChild(h); setTimeout(() => h.remove(), 800);
  if (!V[id].liked) like(id);
}
function watch(id) {
  const o = document.createElement('div');
  o.id = 'ov'; o.className = 'fixed inset-0 z-40 bg-black fi';
  o.innerHTML = `<button onclick="$('ov').remove()" class="absolute top-3 left-3 z-20 w-10 h-10 rounded-full bg-black/50"><i class="fa-solid fa-chevron-left"></i></button><div id="feed2" class="h-full overflow-y-scroll ns snap-y snap-mandatory">${CUR.map(card).join('')}</div>`;
  document.body.appendChild(o);
  const f = $('feed2'); f.querySelector(`[data-v="${id}"]`).scrollIntoView(); autoplay(f);
}
const thumb = (v) => `<div class="aspect-[3/4] bg-zinc-900 relative cursor-pointer" onclick="watch('${v.id}')"><video src="${API + v.url}#t=0.1" muted preload="metadata" class="w-full h-full object-cover pointer-events-none"></video><span class="absolute bottom-1 left-1 text-xs drop-shadow"><i class="fa-solid fa-heart"></i> ${v.likes}</span></div>`;

// ---------- comments / share / stickers ----------
const cm = (c) => `<div class="flex gap-2">${avi(c.avatar, c.author, 'w-8 h-8 text-xs')}<div class="min-w-0"><b class="text-xs text-white/60">@${esc(c.author)}</b>${c.text ? `<p class="text-sm">${esc(c.text)}</p>` : ''}${media(c)}</div></div>`;
function share(id) {
  sheet(`<div class="p-5 grid grid-cols-4 gap-2 text-center text-xs">
  <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/#'+'${id}');closeSheet();toast('Link copied')" class="space-y-2"><div class="w-14 h-14 mx-auto rounded-full bg-white/10 flex items-center justify-center text-xl"><i class="fa-solid fa-link"></i></div>Copy link</button>
  <button onclick="mkSticker('${id}')" class="space-y-2"><div class="w-14 h-14 mx-auto rounded-full bg-white/10 flex items-center justify-center text-xl"><i class="fa-solid fa-note-sticky"></i></div>Create sticker</button>
  <button onclick="saveSound('${id}')" class="space-y-2"><div class="w-14 h-14 mx-auto rounded-full bg-white/10 flex items-center justify-center text-xl"><i class="fa-solid fa-music"></i></div>Save sound</button>
  <button onclick="saveVideo('${id}')" class="space-y-2"><div class="w-14 h-14 mx-auto rounded-full bg-[var(--a)] flex items-center justify-center text-xl"><i class="fa-solid fa-download"></i></div>Save video</button></div>`);
}

// ---------- sounds: save the audio of any video, then use it in comments and messages ----------
const getSounds = () => { try { return JSON.parse(localStorage.getItem('jt_sounds')) || []; } catch (e) { return []; } };
function toWav(buf, secs) {
  const sr = buf.sampleRate, n = Math.min(buf.length, Math.floor(sr * secs)), ch = buf.numberOfChannels, o = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (p, s) => [...s].forEach((c, i) => o.setUint8(p + i, c.charCodeAt(0)));
  w(0, 'RIFF'); o.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); o.setUint32(16, 16, true); o.setUint16(20, 1, true); o.setUint16(22, 1, true);
  o.setUint32(24, sr, true); o.setUint32(28, sr * 2, true); o.setUint16(32, 2, true); o.setUint16(34, 16, true); w(36, 'data'); o.setUint32(40, n * 2, true);
  const d = []; for (let c = 0; c < ch; c++) d.push(buf.getChannelData(c));
  for (let i = 0; i < n; i++) { let s = 0; for (let c = 0; c < ch; c++) s += d[c][i]; s = Math.max(-1, Math.min(1, s / ch)); o.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true); }
  return new Blob([o], { type: 'audio/wav' });
}
async function saveSound(id) {
  const v = V[id]; toast('Grabbing sound...');
  try {
    const ab = await (await fetch(API + v.url)).arrayBuffer(), ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)); ctx.close();
    const fd = new FormData(); fd.append('media', toWav(buf, 15), 'sound.wav');
    const u = (await api('/api/media', { method: 'POST', body: fd })).url, l = getSounds();
    l.unshift({ url: u, name: '@' + v.author + ' original sound' });
    localStorage.setItem('jt_sounds', JSON.stringify(l.slice(0, 30)));
    closeSheet(); toast('Sound saved! Tap the music note in comments or messages');
  } catch (e) { toast('Could not get the sound from this video', 1); }
}
function pickSound(cb, back) {
  _cb = cb; const l = getSounds();
  sheet(`<div class="p-4"><div class="flex items-center justify-between mb-3"><h3 class="font-bold text-sm">Sounds</h3><button onclick="${back ? 'closeSheet();(' + back + ')()' : 'closeSheet()'}" class="text-white/60 text-sm">Back</button></div>
  <div class="space-y-2">${l.map((s, i) => `<div class="p-2 bg-white/5 rounded-xl space-y-1"><p class="text-xs text-white/60">${esc(s.name)}</p><div class="flex items-center gap-2"><audio controls preload="none" src="${API + s.url}" class="h-9 flex-1 min-w-0"></audio><button onclick="_cb(getSounds()[${i}])" class="px-4 py-2 rounded-lg bg-[var(--a)] text-xs font-semibold">Use</button></div></div>`).join('')}</div>
  ${l.length ? '' : '<p class="text-center text-white/40 text-sm py-8">No sounds yet. Tap Share, then Save sound, on any video.</p>'}</div>`);
}

async function follow(n) {
  try {
    const d = await api('/api/users/' + n + '/follow', { method: 'POST' });
    if (n == 'jaxtok') ME.followsJt = d.following;
    document.querySelectorAll(`[data-f="${n}"]`).forEach((e) => e.classList.contains('plus') ? e.remove() : e.textContent = d.following ? 'Following' : 'Follow');
    toast(d.following ? 'Following @' + n : 'Unfollowed @' + n);
  } catch (e) { fail(e); }
}

// ---------- profile ----------
function openUser(n) { closeSheet(); if ($('ov')) $('ov').remove(); S.tab = 'me'; hl(n == ME.username ? 'me' : ''); profileView(n); }
async function profileView(n) {
  n = n || ME.username;
  try {
    const p = await api('/api/users/' + n), mine = n == ME.username; CUR = p.videos; p.videos.forEach((v) => V[v.id] = v);
    $('view').innerHTML = `<div class="h-full overflow-y-auto ns fi"><div class="p-6 text-center space-y-2 relative">
    ${mine ? `<button onclick="settings()" class="absolute right-4 top-4 text-xl"><i class="fa-solid fa-gear"></i></button>` : `<button onclick="go('home')" class="absolute left-4 top-4 text-xl"><i class="fa-solid fa-chevron-left"></i></button>`}
    <div class="flex justify-center">${avi(p.avatar, p.username, 'w-24 h-24 text-4xl')}</div><b>@${esc(p.username)}</b>
    <div class="flex justify-center gap-8 text-sm">${[['Following', p.following], ['Followers', p.followers], ['Likes', p.likes]].map(([l, c]) => `<div><b>${c}</b><p class="text-white/50 text-xs">${l}</p></div>`).join('')}</div>
    <p class="text-sm text-white/70">${esc(p.bio)}</p>
    ${mine ? `<button onclick="settings()" class="px-6 py-2 rounded-lg bg-white/10 text-sm font-semibold">Edit profile &amp; settings</button>`
      : `<div class="flex justify-center gap-2"><button data-f="${p.username}" onclick="follow('${p.username}')" class="px-6 py-2 rounded-lg bg-[var(--a)] text-sm font-semibold">${p.isFollowing ? 'Following' : 'Follow'}</button><button onclick="openChat('${p.username}')" class="px-6 py-2 rounded-lg bg-white/10 text-sm font-semibold">Message</button></div>`}
    </div><div class="grid grid-cols-3 gap-0.5">${p.videos.map(thumb).join('') || '<p class="col-span-3 text-center text-white/40 text-sm py-10">No videos yet</p>'}</div></div>`;
  } catch (e) { fail(e); }
}
const COLORS = ['#ec4899', '#22d3ee', '#a78bfa', '#f59e0b', '#22c55e', '#ef4444'];

// ---------- discover ----------

let _rec = null;
async function voice(btn, cb) {
  if (_rec) { _rec.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true }), ch = [], r = new MediaRecorder(st);
    _rec = r; btn.classList.add('text-red-500'); btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
    r.ondataavailable = (e) => ch.push(e.data);
    r.onstop = async () => {
      st.getTracks().forEach((t) => t.stop()); _rec = null; btn.classList.remove('text-red-500'); btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
      const fd = new FormData(); fd.append('media', new Blob(ch, { type: (r.mimeType || 'audio/webm').split(';')[0] }), 'voice');
      try { cb((await api('/api/media', { method: 'POST', body: fd })).url); } catch (e) { fail(e); }
    };
    r.start(); setTimeout(() => _rec === r && r.stop(), 60000);
  } catch (e) { toast('Microphone not available', 1); }
}

    sheet(`<div class="p-4"><div class="flex items-center justify-between mb-3"><h3 class="font-bold text-sm">Stickers</h3><button onclick="${back ? 'closeSheet();(' + back + ')()' : 'closeSheet()'}" class="text-white/60 text-sm">Back</button></div>

    ${l.map((s) => `<button onclick="_cb(${esc(JSON.stringify(s))})" class="aspect-square bg-white/5 rounded-xl p-1 flex items-center justify-center">${stk(s.url, 'max-w-full max-h-full')}</button>`).join('')}</div></div>`);

function stickerFile(i) {
  const f = i.files[0]; if (!f) return;
  const [cb, back] = _pk, img = f.type.startsWith('image/');

  el.onerror = () => toast('Could not open that file', 1);
  el[img ? 'onload' : 'onloadeddata'] = () => { mkSticker(null, el); SC.back = () => pickSticker(cb, back); };
  el.src = URL.createObjectURL(f);

// sticker creator: crop ratio, pick the frame/start, and length from frozen (0) up to 5s
let SC = { r: 1, len: 0 };
function mkSticker(id, el) {
  _sv = el || document.querySelector(`[data-v="${id}"] video`); if (_sv.pause) _sv.pause(); SC = { r: 1, len: 0 };
  const vid = _sv.tagName == 'VIDEO', dur = vid && isFinite(_sv.duration) ? Math.floor(_sv.duration * 10) / 10 : 0;
  sheet(`<div class="p-5 space-y-3 text-center"><h3 class="font-bold text-sm">Create sticker</h3>
  <canvas id="sc" class="mx-auto rounded-2xl max-h-[34vh] max-w-full bg-zinc-800"></canvas>
  <div class="flex justify-center gap-2">${[['16:9', 16 / 9], ['1:1', 1], ['4:3', 4 / 3]].map(([l, r]) => `<button data-r="${r}" onclick="SC.r=${r};drawS();optHl()" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs">${l}</button>`).join('')}</div>
  ${vid ? `<div class="text-left"><p class="text-xs text-white/60 mb-1">Frame / start: <b id="ts">${_sv.currentTime.toFixed(1)}s</b></p>
    <input type="range" min="0" max="${dur}" step="0.1" value="${_sv.currentTime}" oninput="seekS(this.value)" class="w-full accent-[var(--a)]">
    <p class="text-xs text-white/60 mt-2 mb-1">Length: <b id="ll">Frozen (still)</b></p>
    <input type="range" min="0" max="5" step="0.5" value="0" oninput="SC.len=+this.value;$('ll').textContent=SC.len?SC.len+'s clip':'Frozen (still)'" class="w-full accent-[var(--a)]"></div>` : ''}
  <input id="st" oninput="drawS()" maxlength="24" placeholder="Add text (optional)" class="${inp}">
  <button id="sv" onclick="saveSticker()" class="w-full py-3 rounded-xl font-semibold bg-[var(--a)]">Save sticker</button></div>`);
  optHl(); drawS();
}
function seekS(t) { $('ts').textContent = (+t).toFixed(1) + 's'; _sv.onseeked = drawS; _sv.currentTime = +t; }
function optHl() {
  document.querySelectorAll('#sheet [data-r]').forEach((b) => b.style.outline = +b.dataset.r === SC.r ? '2px solid var(--a)' : '');
}
function drawS() {
  const c = $('sc'); if (!c) return;
  const W = 320, H = Math.round(W / SC.r); if (c.width != W || c.height != H) { c.width = W; c.height = H; }
  const x = c.getContext('2d'), t = $('st').value, vw = _sv.videoWidth || _sv.naturalWidth || W, vh = _sv.videoHeight || _sv.naturalHeight || W, k = Math.max(W / vw, H / vh);
  x.clearRect(0, 0, W, H); x.save();
  if (x.roundRect) { x.beginPath(); x.roundRect(0, 0, W, H, 28); x.clip(); }
  x.drawImage(_sv, (W - vw * k) / 2, (H - vh * k) / 2, vw * k, vh * k); x.restore();
  if (t) { x.font = '800 34px system-ui'; x.textAlign = 'center'; x.lineWidth = 8; x.lineJoin = 'round'; x.strokeStyle = '#000'; x.strokeText(t, W / 2, H - 24, W - 20); x.fillStyle = '#fff'; x.fillText(t, W / 2, H - 24, W - 20); }
}
async function saveSticker() {
  const c = $('sc'), b = $('sv'), name = $('st').value || 'sticker';
  const send = async (blob, fn) => {
    const fd = new FormData(); fd.append('name', name); fd.append('sticker', blob, fn);
    try { await api('/api/stickers', { method: 'POST', body: fd }); closeSheet(); toast('Sticker saved!'); if (SC.back) SC.back(); } catch (e) { fail(e); b.disabled = false; b.textContent = 'Save sticker'; }
  };
  b.disabled = true;
  if (!SC.len) { c.toBlob((bl) => bl ? send(bl, 's.png') : toast('Could not capture this frame', 1), 'image/png'); return; }
  if (!c.captureStream || !window.MediaRecorder) { toast('Clip stickers are not supported in this browser', 1); b.disabled = false; return; }
  b.textContent = 'Recording ' + SC.len + 's...';
  const ch = [], rec = new MediaRecorder(c.captureStream(30));
  rec.ondataavailable = (e) => e.data.size && ch.push(e.data);
  rec.onstop = () => send(new Blob(ch, { type: (rec.mimeType || 'video/webm').split(';')[0] }), 'clip');
  const t0 = performance.now(); _sv.muted = true; _sv.loop = true; rec.start(); try { await _sv.play(); } catch (e) {}
  (function loop() { drawS(); if (performance.now() - t0 < SC.len * 1000) requestAnimationFrame(loop); else { rec.stop(); _sv.pause(); } })();
}

// ---------- save video with animated JaxTok watermark + outro ----------
const WM = new Image(); WM.src = uri(LOGO.replace('<svg ', '<svg width="200" height="200" '));
async function saveVideo(id) {
  const v = V[id]; closeSheet();
  if (!window.MediaRecorder) return toast('Saving videos is not supported in this browser', 1);
  const ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
  const el = document.createElement('video'); el.crossOrigin = 'anonymous'; el.playsInline = true; el.src = API + v.url;
  const ov = document.createElement('div');
  ov.className = 'fixed inset-0 z-[70] bg-black/85 flex flex-col items-center justify-center gap-3 text-center p-8 fi';
  ov.innerHTML = `<img src="${uri(LOGO)}" class="w-16 h-16"><b>Saving video...</b><p id="svp" class="text-sm text-white/60">Keep this tab open</p>`;
  document.body.appendChild(ov);
  const done = (m) => { ov.remove(); ac.close().catch(() => {}); if (m) toast(m, 1); };
  try { await el.play(); el.pause(); await WM.decode().catch(() => {}); } catch (e) { return done('Could not load this video'); }

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), dest = ac.createMediaStreamDestination();
  ac.createMediaElementSource(el).connect(dest);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {}), ch = [];
  rec.ondataavailable = (e) => e.data.size && ch.push(e.data);
  rec.onstop = () => {
    const t = (rec.mimeType || mime || 'video/webm').split(';')[0], a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(ch, { type: t })); a.download = 'jaxtok-' + v.author + (t.includes('mp4') ? '.mp4' : '.webm');
    document.body.appendChild(a); a.click(); a.remove(); done(); toast('Video saved!');
  };
  const jingle = () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {

    o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + (i == 4 ? 1.6 : .5)); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 1.7);
  });
  const back = (p) => { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const logo = (cx, cy, s, rot) => { x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(s, s); x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 12 * u; x.drawImage(WM, -40 * u, -40 * u, 80 * u, 80 * u); x.restore(); };
  // watermark like TikTok's: still logo + name, fades to a second spot halfway where @username appears
  const mark = (t, d) => {
    const h = d / 2, second = t > h, lt = second ? t - h : t;
    const a = Math.max(0, Math.min(1, lt / .4, second ? 1 : (h - t) / .4)) * .92;

    x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 5 * u;
    x.font = `800 ${19 * u}px system-ui,sans-serif`; x.fillText('JaxTok', cx + 34 * u, cy - (second ? 9 * u : 0));
    if (second) { x.font = `700 ${14 * u}px system-ui,sans-serif`; x.fillText('@' + v.author, cx + 34 * u, cy + 12 * u, W - 90 * u); }
    x.restore();
  };
  const end = (tt) => {
    const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#ec4899'); g.addColorStop(1, '#22d3ee'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.12)';
    for (let i = 0; i < 8; i++) { const r = (20 + i * 9) * u, by = H - ((tt * 60 * u * (1 + i * .15) + i * 140 * u) % (H + 2 * r)) + r; x.beginPath(); x.arc(W * ((i * 37 % 100) / 100), by, r, 0, 7); x.fill(); }
    const pop = Math.min(1, tt / .7), y = H * .36;
    logo(W / 2, y, 2.1 * back(pop) * (1 + .06 * Math.sin(tt * 8)), Math.sin(tt * 9) * .14 + (1 - pop) * Math.PI * 2);
    x.save(); x.globalAlpha = Math.max(0, Math.min(1, (tt - .5) / .5)); x.textAlign = 'center'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 8 * u;
    x.font = `800 ${46 * u}px system-ui,sans-serif`; x.fillText('JaxTok', W / 2, y + 140 * u, W - 30 * u);
    x.font = `700 ${19 * u}px system-ui,sans-serif`; x.fillText('Download JaxTok', W / 2, y + 185 * u, W - 30 * u); x.fillText('to discover new videos', W / 2, y + 212 * u, W - 30 * u);
    x.restore();

  let phase = 0, t0 = 0;
  const loop = () => {

    } else { const tt = (performance.now() - t0) / 1000; end(tt); if (tt > 3.4) { rec.stop(); return; } }

  try { rec.start(250); el.currentTime = 0; el.muted = false; await el.play(); requestAnimationFrame(loop); }
  catch (e) { if (rec.state != 'inactive') { rec.onstop = null; rec.stop(); } done('Could not save this video'); }
}
