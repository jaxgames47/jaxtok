<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JaxTok Social App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="h-full text-slate-100 flex flex-col overflow-hidden select-none">
<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

<div id="app" class="flex-1 flex flex-col h-full relative overflow-hidden">

  <!-- LOGIN -->
  <div id="auth-gate" class="absolute inset-0 z-40 bg-slate-950 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-tr from-pink-500 to-cyan-400 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-500/20"><i class="fa-solid fa-bolt text-2xl text-white"></i></div>
        <h1 class="text-2xl font-bold text-white">Welcome to JaxTok</h1>
        <p id="auth-subtitle" class="text-sm text-slate-400 mt-1">Sign in or create an account to access the video feed</p>
      </div>
      <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event)">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
          <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-pink-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password (6+ characters)</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-pink-500">
        </div>
        <button type="submit" id="auth-submit-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-pink-500 to-cyan-500 hover:from-pink-600 hover:to-cyan-600 text-white font-semibold rounded-xl shadow-lg shadow-pink-500/25">Sign In</button>
      </form>
      <div class="mt-6 text-center">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-slate-400 hover:text-white">Don't have an account? <span class="text-pink-400 font-semibold underline">Create one</span></button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main-dashboard" class="flex-1 flex flex-col h-full hidden relative">
    <header class="h-14 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md px-4 flex items-center justify-between z-30 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-gradient-to-tr from-pink-500 to-cyan-400 rounded-lg flex items-center justify-center"><i class="fa-solid fa-bolt text-sm text-white"></i></div>
        <span class="font-extrabold text-lg text-white">JaxTok</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-display-email" class="text-xs text-slate-400 hidden sm:inline-block"></span>
        <button onclick="openUploadModal()" class="flex items-center gap-2 bg-pink-500 hover:bg-pink-600 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold"><i class="fa-solid fa-plus"></i> Upload / Record</button>
        <button onclick="logoutUser()" title="Sign Out" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </header>
    <main class="flex-1 relative overflow-hidden bg-slate-950 flex justify-center">
      <div id="feed-container" class="w-full max-w-md h-full overflow-y-scroll no-scrollbar snap-y snap-mandatory relative bg-slate-900"></div>
      <div id="empty-feed" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center hidden z-10 bg-slate-900">
        <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 text-3xl mb-4"><i class="fa-solid fa-film"></i></div>
        <h3 class="text-lg font-bold text-white">No Videos Found</h3>
        <p class="text-sm text-slate-400 max-w-xs mt-1 mb-6">Be the first creator to share a video on JaxTok!</p>
        <button onclick="openUploadModal()" class="px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-xl text-sm">Create First Video</button>
      </div>
    </main>
  </div>

  <!-- UPLOAD MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
        <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-video text-pink-500"></i> Create New Video</h2>
        <button onclick="closeUploadModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex bg-slate-950 p-1 rounded-xl mb-4 border border-slate-800">
        <button onclick="switchUploadTab('file')" id="tab-file-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-white">Upload File</button>
        <button onclick="switchUploadTab('record')" id="tab-record-btn" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">Record Webcam</button>
      </div>
      <div id="section-file" class="space-y-4">
        <div id="drop-zone" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)" class="border-2 border-dashed border-slate-700 hover:border-pink-500 bg-slate-950/50 rounded-2xl p-8 text-center flex flex-col items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-pink-500/10 text-pink-400 flex items-center justify-center text-xl mb-3"><i class="fa-solid fa-cloud-arrow-up"></i></div>
          <p class="text-sm font-medium text-slate-200">Drag &amp; drop your video here</p>
          <p class="text-xs text-slate-500 mt-1">MP4, WebM or MOV up to 50MB</p>
          <label class="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl cursor-pointer">Browse Files
            <input type="file" id="video-file-input" accept="video/mp4,video/webm,video/quicktime" class="hidden" onchange="handleFileSelected(this)">
          </label>
        </div>
      </div>
      <div id="section-record" class="space-y-4 hidden">
        <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-[9/16] max-h-80 flex items-center justify-center border border-slate-800">
          <video id="webcam-preview" autoplay muted playsinline class="w-full h-full object-cover"></video>
          <div id="recording-timer" class="absolute top-3 left-3 bg-red-500/80 text-white px-2.5 py-1 rounded-full text-xs font-bold hidden items-center gap-1.5">REC <span id="timer-display">00:00</span></div>
        </div>
        <div class="flex justify-center gap-3">
          <button type="button" id="start-cam-btn" onclick="startWebcam()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl"><i class="fa-solid fa-camera mr-1"></i> Start Camera</button>
          <button type="button" id="rec-btn" onclick="toggleRecording()" disabled class="px-4 py-2 bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white text-xs font-semibold rounded-xl"><i class="fa-solid fa-circle mr-1"></i> Start Recording</button>
        </div>
      </div>
      <div id="section-details" class="space-y-4 mt-4 hidden">
        <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
          <video id="selected-video-preview" muted class="w-16 h-16 rounded-lg object-cover bg-black"></video>
          <div class="flex-1 min-w-0">
            <p id="selected-filename" class="text-xs font-medium text-slate-200 truncate">video.mp4</p>
            <p class="text-xs text-slate-500 mt-0.5">Ready to publish</p>
          </div>
          <button onclick="resetSelectedVideo()" class="text-slate-400 hover:text-red-400 text-xs p-2"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Caption</label>
          <textarea id="video-caption-input" rows="2" placeholder="Write an awesome caption... #fyp" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-pink-500 resize-none"></textarea>
        </div>
        <button onclick="publishVideo()" id="publish-btn" class="w-full py-3 bg-gradient-to-r from-pink-500 to-cyan-500 text-white font-semibold rounded-xl text-sm">Publish Video</button>
      </div>
    </div>
  </div>
</div>

<script>
// If the server also serves this page (recommended), leave this empty.
const API_BASE = '';

let token = localStorage.getItem('jaxtok_token');
let currentUser = null, isSignUpMode = false, activeVideoBlob = null;
let mediaRecorder = null, recordedChunks = [], recordingInterval = null, recordingSeconds = 0, webcamStream = null;
let feedVideos = [];

const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  const r = await fetch(API_BASE + path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
const jsonPost = (body) => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function showToast(message, type = 'success') {
  const t = document.createElement('div');
  t.className = (type === 'error' ? 'bg-red-600' : 'bg-slate-800 border border-slate-700') + ' text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold pointer-events-auto';
  t.textContent = message;
  $('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ---- AUTH ----
function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  $('auth-subtitle').innerText = isSignUpMode ? 'Create a new account to join JaxTok' : 'Sign in or create an account to access the video feed';
  $('auth-submit-btn').innerText = isSignUpMode ? 'Create Account' : 'Sign In';
  $('auth-toggle-btn').innerHTML = isSignUpMode
    ? 'Already have an account? <span class="text-pink-400 font-semibold underline">Sign In</span>'
    : 'Don\'t have an account? <span class="text-pink-400 font-semibold underline">Create one</span>';
}
async function handleAuthSubmit(e) {
  e.preventDefault();
  try {
    const d = await api(isSignUpMode ? '/api/signup' : '/api/login', jsonPost({ email: $('auth-email').value.trim(), password: $('auth-password').value }));
    token = d.token;
    localStorage.setItem('jaxtok_token', token);
    loginSuccess(d.username);
    showToast(isSignUpMode ? 'Account created!' : 'Welcome back, ' + d.username);
  } catch (err) { showToast(err.message, 'error'); }
}
function loginSuccess(name) {
  currentUser = name;
  $('auth-gate').classList.add('hidden');
  $('main-dashboard').classList.remove('hidden');
  $('user-display-email').innerText = name;
  loadFeed();
}
function logoutUser() {
  currentUser = null; token = null;
  localStorage.removeItem('jaxtok_token');
  $('main-dashboard').classList.add('hidden');
  $('auth-gate').classList.remove('hidden');
  $('auth-form').reset();
  stopWebcam();
}

// ---- UPLOAD MODAL ----
function openUploadModal() { $('upload-modal').classList.remove('hidden'); switchUploadTab('file'); }
function closeUploadModal() { $('upload-modal').classList.add('hidden'); stopWebcam(); resetSelectedVideo(); }
function switchUploadTab(mode) {
  const on = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-white';
  const off = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white';
  $('tab-file-btn').className = mode === 'file' ? on : off;
  $('tab-record-btn').className = mode === 'file' ? off : on;
  $('section-file').classList.toggle('hidden', mode !== 'file');
  $('section-record').classList.toggle('hidden', mode === 'file');
  if (mode === 'file') stopWebcam();
}
function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('border-pink-500'); }
function handleDragLeave(e) { e.preventDefault(); e.currentTarget.classList.remove('border-pink-500'); }
function handleDrop(e) {
  e.preventDefault(); e.currentTarget.classList.remove('border-pink-500');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('video/')) processVideoBlob(f, f.name); else showToast('Please drop a valid video file.', 'error');
}
function handleFileSelected(input) { if (input.files.length) processVideoBlob(input.files[0], input.files[0].name); }
function processVideoBlob(blob, filename) {
  activeVideoBlob = blob;
  $('section-file').classList.add('hidden');
  $('section-record').classList.add('hidden');
  $('section-details').classList.remove('hidden');
  $('selected-video-preview').src = URL.createObjectURL(blob);
  $('selected-filename').innerText = filename;
}
function resetSelectedVideo() {
  activeVideoBlob = null;
  $('video-caption-input').value = '';
  $('video-file-input').value = '';
  $('section-details').classList.add('hidden');
  $('section-file').classList.remove('hidden');
  if ($('tab-record-btn').classList.contains('bg-slate-800')) switchUploadTab('record');
}

// ---- WEBCAM ----
async function startWebcam() {
  try {
    webcamStream = await navigator.mediaDevices.getUserMedia({ video: { width: 720, height: 1280 }, audio: true });
    $('webcam-preview').srcObject = webcamStream;
    $('start-cam-btn').classList.add('hidden');
    $('rec-btn').disabled = false;
  } catch (err) { showToast('Unable to access webcam/microphone.', 'error'); }
}
function stopWebcam() {
  if (webcamStream) { webcamStream.getTracks().forEach((t) => t.stop()); webcamStream = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  clearInterval(recordingInterval);
  $('start-cam-btn').classList.remove('hidden');
  $('rec-btn').disabled = true;
  $('rec-btn').innerHTML = '<i class="fa-solid fa-circle mr-1"></i> Start Recording';
  $('recording-timer').classList.add('hidden');
}
function toggleRecording() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    recordedChunks = [];
    try { mediaRecorder = new MediaRecorder(webcamStream, { mimeType: 'video/webm;codecs=vp8,opus' }); }
    catch (e) { mediaRecorder = new MediaRecorder(webcamStream); }
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const type = (mediaRecorder.mimeType || 'video/webm').split(';')[0];
      processVideoBlob(new Blob(recordedChunks, { type }), 'webcam_recording');
      stopWebcam();
    };
    mediaRecorder.start();
    $('rec-btn').innerHTML = '<i class="fa-solid fa-stop mr-1"></i> Stop Recording';
    recordingSeconds = 0;
    $('recording-timer').classList.remove('hidden');
    $('recording-timer').classList.add('flex');
    recordingInterval = setInterval(() => {
      recordingSeconds++;
      $('timer-display').innerText = String(Math.floor(recordingSeconds / 60)).padStart(2, '0') + ':' + String(recordingSeconds % 60).padStart(2, '0');
    }, 1000);
  } else { mediaRecorder.stop(); clearInterval(recordingInterval); }
}

// ---- PUBLISH ----
async function publishVideo() {
  if (!activeVideoBlob) return;
  const btn = $('publish-btn');
  btn.disabled = true; btn.innerText = 'Uploading...';
  const fd = new FormData();
  fd.append('caption', $('video-caption-input').value.trim() || 'No caption');
  fd.append('video', activeVideoBlob, activeVideoBlob.name || 'recording.webm');
  try {
    await api('/api/videos', { method: 'POST', body: fd });
    showToast('Video published!');
    closeUploadModal();
    loadFeed();
  } catch (err) { showToast(err.message, 'error'); }
  btn.disabled = false; btn.innerText = 'Publish Video';
}

// ---- FEED ----
async function loadFeed() {
  const container = $('feed-container');
  try { feedVideos = await api('/api/videos'); }
  catch (err) { if (!feedVideos.length) { showToast('Could not load videos.', 'error'); return; } }
  const top = container.scrollTop;
  container.innerHTML = '';
  $('empty-feed').classList.toggle('hidden', feedVideos.length > 0);
  feedVideos.forEach((v) => {
    const card = document.createElement('div');
    card.className = 'w-full h-full snap-start relative bg-black flex items-center justify-center overflow-hidden';
    card.innerHTML = `
      <video src="${API_BASE + v.url}" loop playsinline preload="metadata" class="w-full h-full object-cover cursor-pointer" onclick="togglePlayPause(this)"></video>
      <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-black/60 to-transparent pointer-events-none"></div>
      <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/80 via-black/40 to-transparent pointer-events-none"></div>
      <div class="absolute right-4 bottom-24 flex flex-col items-center gap-5 z-20">
        <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-500 to-cyan-400 p-0.5"><div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center font-bold text-xs text-white">${escapeHtml(v.author.charAt(0).toUpperCase())}</div></div>
        <button onclick="toggleLike('${v.id}')" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-full bg-slate-900/60 flex items-center justify-center text-xl ${v.liked ? 'text-pink-500' : 'text-white'}"><i class="fa-${v.liked ? 'solid' : 'regular'} fa-heart"></i></div>
          <span class="text-xs font-semibold text-white">${v.likes}</span>
        </button>
        <button onclick="openComments('${v.id}')" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-full bg-slate-900/60 flex items-center justify-center text-lg text-white"><i class="fa-solid fa-comment-dots"></i></div>
          <span class="text-xs font-semibold text-white">${v.comments.length}</span>
        </button>
        <button onclick="shareVideo('${v.id}')" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-full bg-slate-900/60 flex items-center justify-center text-lg text-white"><i class="fa-solid fa-share"></i></div>
          <span class="text-xs font-semibold text-white">Share</span>
        </button>
      </div>
      <div class="absolute left-4 bottom-6 right-20 z-20">
        <h4 class="font-bold text-white text-sm mb-1">@${escapeHtml(v.author)}</h4>
        <p class="text-xs text-slate-200 line-clamp-2 leading-relaxed">${escapeHtml(v.caption)}</p>
      </div>`;
    container.appendChild(card);
  });
  container.scrollTop = top;
  const obs = new IntersectionObserver((entries) => entries.forEach((en) => {
    if (en.isIntersecting) en.target.play().catch(() => {}); else { en.target.pause(); en.target.currentTime = 0; }
  }), { threshold: 0.6 });
  container.querySelectorAll('video').forEach((el) => obs.observe(el));
}
function togglePlayPause(el) { el.paused ? el.play() : el.pause(); }

async function toggleLike(id) {
  try { await api('/api/videos/' + id + '/like', { method: 'POST' }); loadFeed(); }
  catch (err) { showToast(err.message, 'error'); }
}
function shareVideo(id) {
  const url = location.href.split('#')[0] + '#video-' + id;
  if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
  showToast('Link copied!');
}

// ---- COMMENTS ----
function openComments(videoId) {
  const v = feedVideos.find((x) => x.id === videoId);
  if (!v) return;
  const old = $('comments-modal'); if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = 'comments-modal';
  modal.className = 'fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4';
  const list = v.comments.map((c) => `
    <div class="flex items-start gap-3 py-2.5 border-b border-slate-800/50">
      <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs text-pink-400 shrink-0">${escapeHtml(c.author.charAt(0).toUpperCase())}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between"><span class="text-xs font-semibold text-slate-300">@${escapeHtml(c.author)}</span>
        <span class="text-[10px] text-slate-500">${new Date(c.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
        <p class="text-xs text-slate-200 mt-1">${escapeHtml(c.text)}</p>
      </div>
    </div>`).join('') || '<div class="text-center py-8 text-slate-500 text-xs">No comments yet. Be the first!</div>';
  modal.innerHTML = `
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl flex flex-col h-[70vh] sm:h-[500px]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
        <h3 class="text-sm font-bold text-white">${v.comments.length} Comments</h3>
        <button onclick="$('comments-modal').remove()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto no-scrollbar pr-1">${list}</div>
      <form onsubmit="postComment(event, '${videoId}')" class="mt-3 pt-3 border-t border-slate-800 flex gap-2">
        <input type="text" id="comment-input" required placeholder="Add a comment..." class="flex-1 px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-pink-500">
        <button type="submit" class="px-4 py-2.5 bg-pink-500 text-white font-semibold rounded-xl text-xs">Post</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
}
async function postComment(e, videoId) {
  e.preventDefault();
  const text = $('comment-input').value.trim();
  if (!text) return;
  try {
    const updated = await api('/api/videos/' + videoId + '/comments', jsonPost({ text }));
    const i = feedVideos.findIndex((x) => x.id === videoId);
    if (i > -1) feedVideos[i] = updated;
    openComments(videoId);
    loadFeed();
  } catch (err) { showToast(err.message, 'error'); }
}

window.addEventListener('DOMContentLoaded', async () => {
  if (!token) return;
  try { loginSuccess((await api('/api/me')).username); }
  catch (err) { token = null; localStorage.removeItem('jaxtok_token'); }
});
</script>
